# gradle/wrapper/gradle-wrapper.properties
# ═════════════════════════════════════════
# Tells the Gradle Wrapper scripts (gradlew / gradlew.bat) which exact version
# of Gradle to use for this project.
#
# The "wrapper" concept: instead of requiring every developer to install a
# specific Gradle version on their machine, the wrapper script downloads the
# correct version automatically on first run, then caches it locally.
# This guarantees every developer and every CI machine uses the same version —
# like specifying the exact cable gauge on a wiring schematic rather than
# leaving it up to whoever shows up on the job.

# Where to cache the downloaded Gradle installation.
# GRADLE_USER_HOME resolves to C:\Users\<you>\.gradle\ on Windows.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists

# The URL to download Gradle 8.6 from if it's not already cached.
# 'bin' = just the runtime binaries (no source or docs) — all we need to build.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip

# Same base/path settings for the downloaded zip file itself.
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
