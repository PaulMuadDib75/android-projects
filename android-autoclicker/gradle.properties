# gradle.properties
# ══════════════════
# Key=value settings that tune the Gradle build system itself.
# These are NOT Android-specific — they affect how the build process runs.
# Changes here apply to every module in the project.

# Give the Gradle daemon (the background process that runs builds) more memory.
# The default is 512m which can cause "out of memory" errors on larger projects.
# 2048m (2 GB) is a comfortable size for an Android project.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable the Gradle configuration cache. Gradle stores the result of the
# "configuration phase" (reading all build.gradle files) so it doesn't
# repeat that work on every build. Speeds up incremental builds significantly.
org.gradle.configuration-cache=true

# Instructs the Android build system to use AndroidX libraries instead of
# the old 'android.support.*' libraries. AndroidX is the modern, actively
# maintained replacement. This MUST be true for any current Android project.
android.useAndroidX=true

# Kotlin code style setting — 'official' tells the IDE formatter to follow
# the official Kotlin style guide (kotlinlang.org/docs/coding-conventions.html).
kotlin.code.style=official
